<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f4" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <title>Administrator sign in — YouAreNext</title>
    <script>try{var t=window.localStorage.getItem("smartqueue.theme");if(t&&t!=="classic")document.documentElement.dataset.theme=t;}catch(e){}</script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <script defer src="{{ url_for('static', filename='i18n.js') }}"></script>
    <script defer src="{{ url_for('static', filename='theme.js') }}"></script>
    <link rel="icon" type="image/png" href="{{ url_for('branding_asset', asset_name='favicon.png', v='3') }}" />
  </head>
  <body>
    <div class="app-shell registration-shell">
      <header class="site-header">
        <div class="header-inner">
          <a class="brand" href="{{ url_for('home') }}" aria-label="YouAreNext home">
            <img class="brand-logo" src="{{ url_for('branding_asset', asset_name='logo.png', v='3') }}" alt="YouAreNext" />
          </a>
          <a class="nav-link" href="{{ url_for('home') }}">Customer discovery</a>
        </div>
      </header>
      <main class="registration-page">
        <section class="registration-card">
          <div class="registration-heading">
            <p class="eyebrow">YOUARENEXT ADMIN</p>
            <h1>Review provider<br /><em>listings.</em></h1>
            <p>Sign in to approve or reject businesses before they appear in customer discovery.</p>
          </div>
          {% if error %}<div class="registration-errors" role="alert">{{ error }}</div>{% endif %}
          <form class="registration-form" method="post" action="{{ url_for('admin_login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <div class="registration-field">
              <label for="admin-password">Administrator password</label>
              <input id="admin-password" name="password" type="password" autocomplete="current-password" required autofocus />
            </div>
            <button class="button button-dark registration-submit" type="submit">Sign in <span aria-hidden="true">→</span></button>
          </form>
        </section>
      </main>
      <footer class="registration-footer"><a href="{{ url_for('home') }}">← Back to YouAreNext</a><span>Provider listings require approval.</span></footer>
    </div>
  </body>
</html>
