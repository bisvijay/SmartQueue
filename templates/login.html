<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f4" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <title>Log in — YouAreNext</title>
    <script>try{var t=window.localStorage.getItem("smartqueue.theme");if(t&&t!=="classic")document.documentElement.dataset.theme=t;}catch(e){}</script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <script defer src="{{ url_for('static', filename='i18n.js') }}"></script>
    <script defer src="{{ url_for('static', filename='theme.js') }}"></script>
    <link rel="icon" type="image/png" href="{{ url_for('branding_asset', asset_name='favicon.png', v='3') }}" />
  </head>
  <body>
    <div class="app-shell registration-shell">
      <header class="site-header">
        <div class="header-inner">
          <a class="brand" href="{{ url_for('home') }}" aria-label="YouAreNext home">
            <img class="brand-logo" src="{{ url_for('branding_asset', asset_name='logo.png', v='3') }}" alt="YouAreNext" />
          </a>
          <a class="nav-link" href="{{ url_for('register') }}">Create account</a>
        </div>
      </header>
      <main class="registration-page">
        <section class="registration-card">
          <div class="registration-heading">
            <p class="eyebrow">WELCOME BACK</p>
            <h1>Good to see<br /><em>you again.</em></h1>
            <p>Sign in to pick up where you left off.</p>
          </div>
          {% if error %}<div class="registration-errors" role="alert">{{ error }}</div>{% endif %}
          <form class="registration-form" action="{{ url_for('login') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <div class="registration-field">
              <label for="identifier">Email address or phone number</label>
              <input id="identifier" name="identifier" autocomplete="username" required autofocus placeholder="you@example.com or 98765 43210" />
            </div>
            <div class="registration-field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="current-password" required />
            </div>
            <button class="button button-dark registration-submit" type="submit">Log in <span aria-hidden="true">→</span></button>
          </form>
          <p class="login-register-link"><a href="{{ url_for('reset_password') }}">Reset password</a></p>
          <p class="login-register-link">New to YouAreNext? <a href="{{ url_for('register') }}">Create an account</a></p>
        </section>
      </main>
      <footer class="registration-footer"><a href="{{ url_for('home') }}">← Back to YouAreNext</a><span>Your time is yours.</span></footer>
    </div>
  </body>
</html>
